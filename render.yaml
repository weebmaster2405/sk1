services:
  - type: web
    name: insideorgs
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn orgchart.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: orgchart.settings_production
      - key: PATH
        value: /usr/lib/postgresql/15/bin:${PATH}
    autoDeploy: true
    buildFilter:
      paths:
      - requirements.txt
      - "**/*.py"
    preInstallCommand: |
      wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add - && \
      echo "deb http://apt.postgresql.org/pub/repos/apt/ bookworm-pgdg main" | tee /etc/apt/sources.list.d/pgdg.list && \
      apt-get update && \
      apt-get install -y \
        python3-dev \
        libpq-dev \
        postgresql-15 \
        postgresql-server-dev-15 \
        gcc \
        build-essential 