[build]
  command = "pip install -r requirements.txt && python manage.py collectstatic --noinput"
  publish = "staticfiles"
  functions = "netlify/functions"

[dev]
  command = "python manage.py runserver"
  port = 8000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/django-api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  PYTHON_VERSION = "3.9" 